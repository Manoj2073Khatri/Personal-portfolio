# Local development database only. Production uses a managed PostgreSQL instance.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - '5433:5432'
    volumes:
      - portfolio-pg:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio']
      interval: 2s
      retries: 20

volumes:
  portfolio-pg:
